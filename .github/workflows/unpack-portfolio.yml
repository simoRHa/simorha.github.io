name: Publish portfolio

on:
  push:
    branches: [main]
    paths:
      - 'site-deploy.zip'
      - '.github/workflows/unpack-portfolio.yml'

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack portfolio
        shell: bash
        run: |
          unzip -oq site-deploy.zip -d .
          rm -rf .site-parts
          rm -f site-deploy.zip

      - name: Commit published site
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Publish portfolio site"
          git push
